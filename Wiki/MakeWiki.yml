/ project:
/   name: AllInOne IDE
/*  version: "1.0.0"
  description: >
    An all-in-one Android IDE supporting eight programming languages,
    with compiler integration and automated GitHub Actions builds.

  platform:
    - Android
    - ARM64
    - AArch64

  package: com.allinone.ide

languages:
  c:
    enabled: true
    extension: ".c"
    compiler: clang
    build_system: cmake
    source_directory: app/src/main/cpp/c

  cpp:
    enabled: true
    extension: ".cpp"
    compiler: clang++
    build_system: cmake
    source_directory: app/src/main/cpp

  java:
    enabled: true
    extension: ".java"
    compiler: javac
    build_system: gradle

  kotlin:
    enabled: true
    extension: ".kt"
    compiler: kotlinc
    build_system: gradle

  javascript:
    enabled: true
    extension: ".js"
    runtime: QuickJS

  typescript:
    enabled: true
    extension: ".ts"
    compiler: tsc
    runtime: QuickJS

  go:
    enabled: true
    extension: ".go"
    compiler: go
    configuration: go.mod

  rust:
    enabled: true
    extension: ".rs"
    compiler: rustc
    package_manager: cargo
    configuration: Cargo.toml

android:
  min_sdk: 23
  target_sdk: 35
  language: Kotlin
  ui: XML
  native_code: C++

architecture:
  main_activity: MainActivity.kt
  compiler_manager: CompilerManager.kt

  managers:
    - CManager.kt
    - CppManager.kt
    - JavaManager.kt
    - KotlinManager.kt
    - JavaScriptManager.kt
    - TypeScriptManager.kt
    - GoManager.kt
    - RustManager.kt

  directories:
    source: app/src/main/
    kotlin: app/src/main/java/com/allinone/ide/
    native: app/src/main/cpp/
    assets: app/src/main/assets/
    resources: app/src/main/res/

features:
  - Multi-language editor
  - Syntax highlighting
  - File explorer
  - Build system
  - Run system
  - Terminal console
  - Compiler error reporting
  - Dark theme
  - GitHub integration

build:
  system: Gradle
  file: build.gradle.kts
  command: ./gradlew assembleDebug
  output: app/build/outputs/apk/debug/

github_actions:
  workflow: .github/workflows/build.yml
  triggers:
    - push
    - workflow_dispatch

  artifacts:
    name: AllInOneIDE-APK
    path: app/build/outputs/apk/debug/*.apk

documentation:
  wiki: wiki/
  readme: README.md
  license: LICENSE

status:
  development: true
/*  production: false
